<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wheel Counter</title>
</head>
<body>
    <h1>Wheel Counter</h1>
    <p>Use <code>widget="wheel_counter"</code> on an Odoo 13 integer field.</p>
    <ul>
        <li>Scroll up to increase by 1.</li>
        <li>Scroll down to decrease by 1.</li>
        <li>Use the up and down arrows on the right side of the field.</li>
    </ul>
</body>
</html>
